
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'marketing_analytics'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'marketing_analytics'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  marketing_analytics:
    # Config indicated by + and applies to all files under models/example/

    staging:
      +materialized: view
      +catalog: "{{ 'silver_production' if env_var('DBT_TARGET', 'dev') == 'production' else 'silver_staging' if env_var('DBT_TARGET', 'dev') == 'staging' else env_var('CI_CATALOG', 'ci_development') if env_var('DBT_TARGET', 'dev') == 'ci' else env_var('DEV_CATALOG', 'bronze_dev') }}"
      +schema: staging

    # Harmonize data across advertising platforms
    intermediate:
      +materialized: view
      +catalog: "{{ 'silver_production' if env_var('DBT_TARGET', 'dev') == 'production' else 'silver_staging' if env_var('DBT_TARGET', 'dev') == 'staging' else env_var('CI_CATALOG', 'ci_development') if env_var('DBT_TARGET', 'dev') == 'ci' else env_var('DEV_CATALOG', 'bronze_dev') }}"
      +schema: intermediate

    # Business-ready analytical models
    marts:
      +materialized: table
      +catalog:  "{{ 'gold_production' if env_var('DBT_TARGET', 'dev') == 'production' else 'silver_staging' if env_var('DBT_TARGET', 'dev') == 'staging' else env_var('CI_CATALOG', 'ci_development') if env_var('DBT_TARGET', 'dev') == 'ci' else env_var('DEV_CATALOG', 'bronze_dev') }}"
      +schema: marketing_analytics

  # Elementary observability
  elementary:
    +meta:
      owner: "external_package"
    +catalog: "{{ 'silver_production' if env_var('DBT_TARGET', 'dev') == 'production' else 'silver_staging' if env_var('DBT_TARGET', 'dev') == 'staging' else env_var('CI_CATALOG', 'ci_development') if env_var('DBT_TARGET', 'dev') == 'ci' else env_var('DEV_CATALOG', 'bronze_dev') }}"
    +schema: elementary
    +enabled: "{{ env_var('DBT_TARGET', 'dev') in ['staging', 'production'] }}"
