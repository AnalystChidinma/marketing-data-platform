sources:
  - name: snapchat_ads
    database: "{{ 'bronze_production' if target.name == 'production' else 'bronze_dev' }}"
    description: data from  snapchat plaform (static)
    schema: marketing_raw
    config:
      enabled: true
      meta:
        owner: "@cde_engineer"
      freshness:
        warn_after:
          count: 2
          period: day

    tables:
      - name: snapchat_ads_stats
        description: ads stats on spend, clicks and impression data from  snapchat plaform (static)
        config:
          enabled: true
          event_time: ads_date

      - name: snapchat_ads_ad_history_new_ad_names
        description: snapchat ads history data from  snapchat plaform (static)
        identifier: snapchat_ads_history
        config:
          enabled: true
          event_time: ad_detail_updated_at

      - name: snapchat_ads_adgroup_history_new_ad_group_names
        description: snapchat ads adgroup history data from  snapchat plaform (static)
        identifier: snapchat_ads_adgroup_history
        config:
          enabled: true
          event_time: ad_group_updated_at

      - name: snapchat_ads_campaign_history_new_campaign_names
        description: snapchat ads campaign history data from  snapchat plaform (static)
        config:
          enabled: true